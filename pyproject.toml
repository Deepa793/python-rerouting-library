[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-rerouting-library"
version = "0.1.0"
description = "Lightweight semantic query router with local and cloud dispatch backends"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.1",
    "sentence-transformers>=3.0",
    "joblib>=1.4",
    "openai>=1.0",
]

[project.optional-dependencies]
local-llama = [
    "llama-cpp-python>=0.3",
]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
